[project]
name = "lucg-api"
version = "0.1.0"
description = "API y worker de la plataforma LUCG"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pyjwt[crypto]>=2.9",
  "httpx>=0.27",
  "procrastinate>=3.12,<4",
  "openpyxl>=3.1",
  "python-multipart>=0.0.12",
  "sentry-sdk[fastapi]>=2.17,<3",
  "structlog>=24.4",
]

[dependency-groups]
dev = [
  "pytest>=8.3", "pytest-asyncio>=0.24", "pytest-cov>=6.0", "ruff>=0.8", "mypy>=1.13", "factory-boy>=3.3",
]

[tool.ruff]
line-length = 110
target-version = "py312"
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "RUF"]
ignore = ["S101", "N818"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
